name: Verify question paper generator
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Question-Paper-Generation-main/requirements-lock.txt
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - run: python -m pip install -r Question-Paper-Generation-main/requirements-lock.txt
      - run: python -m pytest Question-Paper-Generation-main/tests -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Question-generation-project-integrated-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Question-generation-project-integrated-frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag question-paper-generator:ci .
